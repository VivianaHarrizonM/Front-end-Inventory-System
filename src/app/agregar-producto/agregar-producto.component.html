<div class="container">
  <div class="container text-center" style="margin: 30px;">
    <h3>Agregar Producto</h3>
  </div>

  <form>
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción del producto</label>
      <input type="text" class="form-control" id="descripcion">
    </div>
    <div class="mb-3">
      <label for="precio" class="form-label">Precio</label>
      <input type="number" step="any" class="form-control" id="precio">
    </div>
    <div class="mb-3">
      <label for="existencia" class="form-label">Precio</label>
      <input type="number"  class="form-control" id="existencia">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-sm me-3" style="background-color: #008f39; border-color:#008f39; color: white;">Agregar</button>
      <a href="/" class="btn btn-sm" style="background-color: #df2cb1; border-color: #df2cb1; color: white;">Regresar</a>
    </div>
  </form>
</div>
